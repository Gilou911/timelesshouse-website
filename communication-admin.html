<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>/* HIG : contenu hors de l'encoche en paysage iPhone */body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}</style>
  <!-- Titre NEUTRE : il s'affiche avant le chargement et sur l'écran de
       connexion, quand on ne sait pas encore quel studio se connecte. Le
       JS le remplace par « <Studio> — Admin » dès l'agence connue. Y
       laisser « TimelessHouse » le montrait à tous les locataires. -->
  <title>Espace agence — Admin</title>

  <!-- PWA : app installable -->
  <link rel="manifest" href="/manifest-admin.webmanifest" />
  <meta name="theme-color" content="#e9e4d9" />
  <link rel="apple-touch-icon" href="/icons/admin-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TH Admin" />
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>

  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/style.css" />


  <!-- Thème posé AVANT le rendu, pour éviter le flash blanc.
       Il suit le réglage de l'appareil : plus de préférence enregistrée,
       plus de bascule dans l'interface. Le choix se fait une fois dans
       le téléphone et vaut pour toutes les applications. -->
  <script>
    (function(){
      try {
        var sombre = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', sombre ? 'dark' : 'light');
        // Ménage : la préférence enregistrée par l'ancienne bascule
        // n'a plus d'effet, autant ne pas la laisser traîner.
        localStorage.removeItem('th-dark-mode');
      } catch(e) {}
    })();
  </script>

  <style>
    body { margin: 0; background: #e9e4d9; font-family: 'Manrope', system-ui, sans-serif; transition: background 0.5s ease; }
    [data-theme="dark"] body { background: #181b20; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(134,121,106,0.32); border-radius: 4px; }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(232,216,190,0.18); }
    [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(232,216,190,0.32); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* ─── RÈGLE « HALO » (anti-collision d'ombres neumorphiques) ───
       Un conteneur qui défile rogne toute ombre peinte hors de sa boîte.
       Toute bande défilante de pastilles réserve donc d'office 12 px
       verticaux (portée du halo d'une pastille raisedXs = 10 px).
       Ne jamais compenser à la main avec py-*/-my-* : la règle gagne.
       display:flex rend chaque enfant « flex item », ce qui active le
       zIndex:2 du jeton raisedXs : une pastille est ainsi toujours
       peinte AU-DESSUS du halo des grandes cartes voisines.
       Les contrôles segmentés (.rounded-full, relief porté par le
       conteneur lui-même, ombres internes) sont exemptés. */
    .overflow-x-auto.no-scrollbar:not(.rounded-full) { display: flex; padding-top: 12px; padding-bottom: 12px; }
    input, textarea, select { font-family: inherit; }
    /* ── HIG P0 : AUCUN contrôle sous 16 px sur téléphone ──
       Sous 16 px, iOS zoome la page au focus… et le zoom RESTE après
       fermeture : c'est le bug « barre de navigation au milieu de
       l'écran » constaté par Gil le 22/07/2026 (formulaire galerie —
       des champs écrits hors composants héritaient de 13-14 px).
       Filet global : impossible d'oublier un champ à l'avenir.
       Les tailles desktop (sm:) restent libres. */
    @media (max-width: 639px) {
      input, select, textarea { font-size: 16px !important; }
    }
    input:focus, textarea:focus, select:focus { outline: none; }

    /* ─── Dark-mode color overrides (palette graphite + ivoire chaud) ─── */
    [data-theme="dark"] .text-stone-900 { color: #e6e8eb !important; }
    [data-theme="dark"] .text-stone-800 { color: #d4d6dc !important; }
    [data-theme="dark"] .text-stone-700 { color: #b6b9c0 !important; }
    [data-theme="dark"] .text-stone-600 { color: #969aa3 !important; }
    /* Audit HIG 30/07/2026 (mesuré sur l'espace perso, mêmes fonds) :
       sur une carte sombre #22262d, les anciennes valeurs tombaient à
       3,9:1 (stone-500) et 2,9:1 (stone-400) — sous le plancher 4.5:1.
       Relevées : 5,8 et 4,7 mesurés. */
    [data-theme="dark"] .text-stone-500 { color: #9aa0a9 !important; }
    [data-theme="dark"] .text-stone-400 { color: #8b909a !important; }
    [data-theme="dark"] .text-stone-300 { color: #4f535c !important; }
    [data-theme="dark"] .bg-white { background-color: #22262d !important; }
    [data-theme="dark"] .bg-stone-50 { background-color: #1d2025 !important; }
    [data-theme="dark"] .bg-stone-100 { background-color: #22262d !important; }
    [data-theme="dark"] .bg-stone-200 { background-color: rgba(232,216,190,0.12) !important; }
    [data-theme="dark"] .bg-stone-300 { background-color: rgba(232,216,190,0.18) !important; }
    [data-theme="dark"] .bg-stone-900 { background-color: #e8d8be !important; }
    /* stone-800 ne porte JAMAIS de texte dans cette console : ce sont des
       barres d'identité (panneau du jour, vue planning) et des jauges de
       progression. Sur le graphite elles étaient invisibles (1,0:1) ;
       en crème elles se détachent à 10,8:1 (audit du 07/08). */
    [data-theme="dark"] .bg-stone-800 { background-color: #e8d8be !important; }
    [data-theme="dark"] .text-white { color: #1a1410 !important; }
    /* …SAUF ce qui est posé sur une COULEUR qui, elle, ne bascule pas :
       les pastilles de réseau social de l'Agenda gardent leur encre
       blanche dans les deux thèmes (mesuré : 5,1:1 sur Instagram, 5,5:1
       sur YouTube, 5,7:1 sur LinkedIn, 6,5:1 sur Facebook, 19:1 sur
       TikTok). Sans cette exception, la bascule les rendait muettes —
       1,05:1 sur le noir TikTok (audit du 07/08). */
    .encre-blanche { color: #fff; }
    /* En nuit, une pastille très sombre (le noir TikTok) se fondait dans
       le graphite : son texte restait lisible mais la pastille n'avait
       plus de contour. Un liseré la redessine sans toucher à l'encre. */
    [data-theme="dark"] .encre-blanche { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28); }
    [data-theme="dark"] .placeholder\:text-stone-400::placeholder { color: #8b909a !important; }
    [data-theme="dark"] .border-stone-200 { border-color: rgba(255,255,255,0.07) !important; }
    [data-theme="dark"] .border-stone-300 { border-color: rgba(232,216,190,0.22) !important; }
    [data-theme="dark"] .border-stone-900 { border-color: #e8d8be !important; }
    [data-theme="dark"] hr { border-color: rgba(255,255,255,0.07) !important; }
    /* Teintes d'ÉTAT en thème sombre (audit HIG 02/08/2026) : bandeaux
       d'erreur, retards et chips restaient des pavés CLAIRS posés sur
       le graphite. Fond = teinte translucide sur la carte, texte
       éclairci — tout mesuré entre 7,9:1 et 12:1 sur #22262d. */
    [data-theme="dark"] .bg-rose-50, [data-theme="dark"] .bg-rose-100 { background-color: rgba(244,63,94,0.16) !important; }
    [data-theme="dark"] .text-rose-700, [data-theme="dark"] .text-rose-600, [data-theme="dark"] .text-rose-500 { color: #f9a8b4 !important; }
    [data-theme="dark"] .bg-amber-50, [data-theme="dark"] .bg-amber-100 { background-color: rgba(245,158,11,0.15) !important; }
    [data-theme="dark"] .text-amber-800, [data-theme="dark"] .text-amber-700, [data-theme="dark"] .text-amber-600 { color: #f2c469 !important; }
    [data-theme="dark"] .text-amber-300 { color: #f7d489 !important; }
    [data-theme="dark"] .bg-emerald-100 { background-color: rgba(16,185,129,0.18) !important; }
    [data-theme="dark"] .text-emerald-700, [data-theme="dark"] .text-emerald-600 { color: #7fdcab !important; }
    [data-theme="dark"] .bg-violet-100 { background-color: rgba(139,92,246,0.18) !important; }
    [data-theme="dark"] .text-violet-700 { color: #c4b0fa !important; }
    /* Le badge de non-lus s'ÉCLAIRCIT en sombre (l'encre y devient
       sombre via .text-white) : 4,97:1 mesuré. */
    [data-theme="dark"] .bg-rose-600 { background-color: #f43f5e !important; }

    /* Smooth theme transitions — only on direct theme-relevant containers,
       NOT on every single DOM element (that caused massive layout thrashing
       with React re-renders and memory spikes). */
    body, header, aside, nav, main {
      transition: background-color 0.45s ease, color 0.45s ease, border-color 0.45s ease;
    }
    /* ════════════════════════════════════════════════════════
       ♿ Correctifs HIG — vague 1 (P0), audit du 20/07/2026
       ════════════════════════════════════════════════════════ */

    /* §6 — Contrastes. Sur le fond crème #e9e4d9, les gris Tailwind
       utilisés pour le texte secondaire tombaient sous 4.5:1 :
       stone-500 → 3.3:1, stone-400 → 2.2:1. Illisibles pour beaucoup
       de gens, surtout sur les libellés de 10-12 px. On assombrit
       sans toucher à la palette de marque. */
    .text-stone-500 { color: #635c50 !important; }   /* 5.2:1 sur crème */
    /* L'ancienne valeur (#6b6357) tenait 4,7:1 sur la crème mais
       tombait à 4,37:1 sur un champ en creux (#e3ddd0) — assombrie
       pour repasser 4.5 partout (audit HIG 30/07/2026, mesuré). */
    .text-stone-400 { color: #655d51 !important; }
    .placeholder\:text-stone-400::placeholder,
    .placeholder\:text-stone-500::placeholder { color: #655d51 !important; }

    /* §16 — Le focus clavier doit toujours se voir. Plusieurs champs
       posent outline:none pour leur style « pressé » : sans ce
       remplacement, la navigation au clavier devient aveugle. */
    :focus-visible {
      outline: 2px solid #2a2620;
      outline-offset: 3px;
      border-radius: 8px;
    }
    [data-theme="dark"] :focus-visible { outline-color: #e8d8be; }

    /* §4 — Cibles tactiles : l'interrupteur jour/nuit mesure 42×22 px.
       On garde son dessin fin et on étend la ZONE TACTILE à 44×44 px
       (la zone cliquable peut dépasser le visuel). `.dark-toggle` sert
       à l'espace client, `.th-hit-44` au composant React de la console
       — qui ne porte aucune classe de style. */
    .dark-toggle, .th-hit-44 { position: relative; }
    .dark-toggle::after, .th-hit-44::after {
      content: ""; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 44px; height: 44px;
    }

    /* ═══════════════════════════════════════════════════════════
       MOUVEMENT — utilitaires partagés (HIG §9)
       ═══════════════════════════════════════════════════════════
       Trois gestes seulement, réutilisés partout : une vue qui entre,
       une liste qui se pose, une modale qui arrive. Chacun a un but —
       dire qu'on a changé d'écran, guider l'œil du haut vers le bas,
       relier la modale au geste qui l'a ouverte. Rien d'ornemental.
       Durées dans les bornes du guide : 220-340 ms pour une transition
       de vue, courbe SORTANTE à l'apparition. Uniquement `transform` et
       `opacity`, donc composité à 60 fps. */
    /* Courbe DOUCE : une exponentielle sortante. Elle démarre vite puis
       se pose très progressivement — c'est ce qui donne l'impression de
       « glisser » plutôt que de s'arrêter net. Réservée à ce qui doit
       paraître calme : le surlignage d'onglet et l'entrée des vues. */
    :root { --ease-doux: cubic-bezier(0.16, 1, 0.3, 1); }

    /* Surlignage d'onglet. Tailwind pose `transition` à 150 ms sur une
       courbe symétrique : le relief de l'onglet actif apparaissait d'un
       coup. On étire et on adoucit — le déplacement du surlignage se
       suit à l'œil au lieu de sauter (demande de Gil). */
    .th-onglet {
      transition: box-shadow 0.44s var(--ease-doux),
                  background-color 0.44s var(--ease-doux),
                  color 0.34s var(--ease-doux),
                  transform 0.16s var(--ease-doux);
    }

    /* Pastille glissante de la barre du bas. Elle ne fait QUE se
       déplacer : largeur et position fixes, seul `translateX` bouge —
       donc composité, sans recalcul de mise en page à chaque image.
       La durée est un peu plus longue que le reste (0,5 s) parce que
       c'est le seul mouvement qu'on SUIT du regard : trop court, l'œil
       ne l'accroche pas et le passage redevient sec. */
    .th-indicateur {
      transition: transform 0.5s var(--ease-doux), opacity 0.3s var(--ease-doux);
      will-change: transform;
    }

    /* Squelette d'attente : un battement lent et discret, juste assez
       pour dire « ça travaille » sans attirer l'œil. Seule l'opacité
       est animée — aucune repeinte. */
    .th-squelette > *, .th-squelette > * > * {
      animation: th-battement 1.8s ease-in-out infinite;
    }
    @keyframes th-battement { 0%, 100% { opacity: 0.55 } 50% { opacity: 0.9 } }

    @keyframes th-entre { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes th-fond  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes th-boite { from { opacity: 0; transform: translateY(18px) scale(0.985); } to { opacity: 1; transform: none; } }
    @keyframes th-feuille { from { transform: translateY(100%); } to { transform: none; } }

    /* Entrée de vue adoucie : un peu plus longue, sur la courbe douce,
       et un déplacement plus court (6 px au lieu de 8) — le contenu se
       pose au lieu de monter. */
    .th-vue { animation: th-entre-doux 0.52s var(--ease-doux) backwards; }
    @keyframes th-entre-doux { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Cascade d'une liste : 35 ms d'écart, plafonnés à 10 éléments.
       Au-delà, tout arrive ensemble — sur une liste de cent clients, un
       décalage cumulé ferait attendre trois secondes pour rien. */
    .th-liste > * { animation: th-entre-doux 0.58s var(--ease-doux) backwards; }
    .th-liste > *:nth-child(1) { animation-delay: 0ms; }
    .th-liste > *:nth-child(2) { animation-delay: 48ms; }
    .th-liste > *:nth-child(3) { animation-delay: 96ms; }
    .th-liste > *:nth-child(4) { animation-delay: 144ms; }
    .th-liste > *:nth-child(5) { animation-delay: 192ms; }
    .th-liste > *:nth-child(6) { animation-delay: 240ms; }
    .th-liste > *:nth-child(7) { animation-delay: 288ms; }
    .th-liste > *:nth-child(8) { animation-delay: 336ms; }
    .th-liste > *:nth-child(9) { animation-delay: 384ms; }
    .th-liste > *:nth-child(n+10) { animation-delay: 432ms; }

    /* Modale : le voile se fond, la boîte monte. Sur téléphone elle
       arrive du BAS, puisque c'est une feuille — le mouvement suit le
       geste (§9). */
    .th-modal-fond  { animation: th-fond 0.22s ease-out backwards; }
    .th-modal-boite { animation: th-boite 0.32s cubic-bezier(0.32, 0.72, 0, 1) backwards; }
    @media (max-width: 639px) {
      .th-modal-boite { animation: th-feuille 0.34s cubic-bezier(0.32, 0.72, 0, 1) backwards; }
    }

    /* Pression sur une surface cliquable qui n'est pas un bouton
       (carte, tuile). Les boutons ont déjà leur `active:scale-95` ;
       une carte sans état pressé paraît morte au doigt (§14). */
    .th-press { transition: transform 0.16s cubic-bezier(0.23, 1, 0.32, 1); }
    .th-press:active { transform: scale(0.985); }

    /* §16 — Respecter « réduire les animations ». */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* ── Champs date et heure sur iOS (audit HIG du 20/07/2026) ──
       Safari donne aux <input type="date|time"> une largeur INTRINSÈQUE
       calculée sur le gabarit natif, qui l'emporte sur `width: 100%` :
       le champ débordait du cadre de la modale, seul élément du
       formulaire à ne pas s'aligner sur les autres (HIG §3, une
       interface s'adapte à son conteneur ; §13, champs de largeur
       cohérente). Trois règles suffisent :
         · appearance: none  → retire le gabarit natif qui impose la largeur
         · min-width: 0      → autorise la réduction sous la largeur mini
         · width/max-width   → aligne exactement sur les autres champs   */
    input[type="date"],
    input[type="time"],
    input[type="datetime-local"],
    input[type="month"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      /* Safari centre verticalement de travers sans hauteur explicite. */
      min-height: 48px;
      /* HIG §13 : 16 px minimum, sinon iOS zoome la page au focus. */
      font-size: 16px;
      font-family: inherit;
      color: inherit;
    }
    /* L'icône native de calendrier reste cliquable et alignée à droite. */
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      margin-left: auto;
      opacity: 0.55;
      cursor: pointer;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="root"></div>


  <script type="module" src="./communication-admin.jsx"></script>
</body>
</html>
