<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Concevoir la galerie</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon-laloge.png" />
<link rel="stylesheet" href="/fonts/fonts.css" />
<style>
  /* ════════════════════════════════════════════════════════════
     🎨 CONCEPTEUR DE GALERIE — 30 % réglages · 70 % aperçu VIVANT
     ════════════════════════════════════════════════════════════
     L'aperçu n'est pas une imitation : c'est galerie.html elle-même,
     en mode aperçu, pilotée par messages. Ce qu'on voit ici est très
     exactement ce que verra le client — il n'y a pas deux moteurs de
     rendu à garder d'accord. */
  :root {
    --bg:#e9e4d9; --surface:#efeae0; --pressed:#e3ddd0; --ink:#2a2620;
    --muted:#635c50; --faint:#6b6357;
    --shadow-d:rgba(168,156,134,0.32); --shadow-l:rgba(255,253,247,0.92);
    --btn-bg:#2a2620; --btn-text:#f5f1e6;
    /* États — mesurés ≥4.5:1 sur pressed ET surface, dans CHAQUE thème
       (audit HIG : le vert valait 4.14:1 en clair, et le rouge 2.32:1 en
       sombre — un échec d'upload y aurait été illisible). */
    --ok:#33654a; --ko:#b3261e;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#181b20; --surface:#22262d; --pressed:#14171c; --ink:#e8e4dc;
      --muted:#9aa0ab; --faint:#8b93a1;
      --shadow-d:rgba(0,0,0,0.55); --shadow-l:rgba(54,60,72,0.28);
      --btn-bg:#e8e4dc; --btn-text:#181b20;
      --ok:#7fc79a; --ko:#f28b82;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--ink); font-family:'Manrope',-apple-system,sans-serif;
    height:100dvh; overflow:hidden;
    /* Safe areas : viewport-fit=cover est posé dans le <meta> — sans ces
       env(), le panneau passait SOUS l'encoche en paysage iPhone. */
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .serif { font-family:'Instrument Serif',Georgia,serif; }

  .studio { display:flex; height:100dvh; }
  /* 30 / 70 — réglages à gauche, aperçu à droite. */
  .panneau {
    width:30%; min-width:320px; max-width:460px; height:100dvh; overflow-y:auto;
    padding:22px 20px 40px; background:var(--surface);
    box-shadow: 8px 0 26px var(--shadow-d);
  }
  .scene { flex:1; min-width:0; height:100dvh; padding:14px; }
  .scene iframe { width:100%; height:100%; border:none; border-radius:20px; background:#000;
    box-shadow: 10px 10px 28px var(--shadow-d), -10px -10px 28px var(--shadow-l); }

  /* Sur écran étroit : l'aperçu passe dessous, à hauteur lisible. */
  @media (max-width: 900px) {
    body { overflow:auto; }
    .studio { flex-direction:column; height:auto; }
    .panneau { width:100%; max-width:none; height:auto; box-shadow:none; }
    .scene { height:70dvh; padding:0 14px calc(14px + env(safe-area-inset-bottom)); }
  }

  /* 11 px : plancher absolu du guide pour du texte utile. */
  .kicker { font-size:0.6875rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  h1 { font-size:1.5rem; font-weight:400; letter-spacing:-.01em; margin-top:4px; }
  .sous { font-size:0.78125rem; color:var(--muted); margin-top:6px; line-height:1.6; }

  .bloc { margin-top:22px; }
  .bloc > .titre { font-size:0.6875rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:10px; }
  /* Note explicative sous un réglage. Existait en style inline sous une
     classe `metier-hint` jamais définie ici — seul l'inline la tenait
     debout, et rien n'aurait signalé sa disparition. */
  .note { margin-top:8px; font-size:0.75rem; line-height:1.5; color:var(--faint); }
  /* Description sous le libellé d'une option (bouton .choix). */
  .opt-desc { display:block; font-weight:500; font-size:0.75rem; opacity:.75; margin-top:2px; }

  .choix { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .choix button {
    border:none; cursor:pointer; font-family:inherit; text-align:left;
    padding:11px 13px; border-radius:14px; min-height:44px;
    background:var(--pressed); color:var(--ink); font-size:0.78125rem; font-weight:600;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
    transition: transform .16s var(--ease-out);
  }
  .choix button:active { transform:scale(.97); }
  .choix button[aria-pressed="true"] { background:var(--btn-bg); color:var(--btn-text); box-shadow:none; }

  /* Palettes : la pastille MONTRE la couleur, le mot seul ne suffit pas. */
  .palettes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .palettes button {
    border:none; cursor:pointer; font-family:inherit; padding:9px; border-radius:14px;
    background:var(--pressed); color:var(--ink); min-height:44px;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition: transform .16s var(--ease-out);
  }
  .palettes button:active { transform:scale(.97); }
  .palettes button[aria-pressed="true"] { background:var(--btn-bg); color:var(--btn-text); box-shadow:none; }
  .pastille { width:26px; height:26px; border-radius:999px; border:1px solid rgba(0,0,0,.12); position:relative; overflow:hidden; }
  .pastille i { position:absolute; inset:0 0 0 50%; }
  .palettes .nom { font-size:0.6875rem; font-weight:700; }

  /* Rail en creux + pastille sombre active : la convention maison pour
     toute barre d'onglets (règle « halo »). */
  .rail {
    display:flex; gap:6px; padding:5px; border-radius:999px; background:var(--pressed);
    box-shadow: inset 3px 3px 7px var(--shadow-d), inset -3px -3px 7px var(--shadow-l);
  }
  .rail button {
    flex:1; border:none; cursor:pointer; font-family:inherit; min-height:44px;
    border-radius:999px; background:transparent; color:var(--muted);
    font-size:0.78125rem; font-weight:700;
    transition: color .3s var(--ease-out), transform .16s var(--ease-out);
  }
  .rail button:active { transform:scale(.97); }
  .rail button[aria-selected="true"] { background:var(--btn-bg); color:var(--btn-text); }

  /* Champs texte — 16 px minimum, sinon iOS zoome à la mise au point. */
  .champ {
    width:100%; min-height:48px; padding:0 18px; border:none; border-radius:999px;
    background:var(--pressed); color:var(--ink); font-size:max(1rem, 16px); font-family:inherit; outline:none;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
  }
  /* 16 px OBLIGATOIRE (pas seulement sur .champ) : sous 16 px, iOS zoome
     sur le champ à la mise au point — et 44 px de cible minimum. */
  .champ.petit { min-height:44px; font-size:max(1rem, 16px); padding:0 15px; }

  .perso { display:flex; gap:10px; }
  .perso label { flex:1; font-size:0.71875rem; color:var(--muted); font-weight:600; display:flex; flex-direction:column; gap:6px; }
  .perso input[type="color"] {
    width:100%; height:44px; border:none; border-radius:12px; background:none; cursor:pointer; padding:0;
  }

  /* Couverture : on choisit une VIGNETTE, pas un nom de fichier. */
  .couvs { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .couvs button {
    border:none; padding:0; cursor:pointer; aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:var(--pressed); position:relative; transition: transform .16s var(--ease-out);
  }
  .couvs button:active { transform:scale(.96); }
  .couvs img { width:100%; height:100%; object-fit:cover; display:block; }
  .couvs button[aria-pressed="true"] { outline:3px solid var(--ink); outline-offset:-3px; }

  .video-item {
    background:var(--pressed); border-radius:16px; padding:12px; margin-top:8px;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
    display:grid; gap:7px;
  }
  .vide-film {
    background:var(--pressed); border-radius:16px; padding:14px;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
    font-size:0.75rem; color:var(--muted); line-height:1.6;
  }
  .vide-film strong { display:block; color:var(--ink); font-size:0.8125rem; margin-bottom:4px; }
  .video-item .v-etat { font-size:0.71875rem; }
  .video-item .v-ok { color:var(--ok); font-weight:700; }
  .video-item .v-attente { color:var(--muted); }
  .video-item .v-vide { color:var(--faint); }
  .video-item .v-up {
    border:none; cursor:pointer; font-family:inherit; min-height:44px; border-radius:999px;
    background:var(--btn-bg); color:var(--btn-text); font-size:0.78125rem; font-weight:700;
    transition: transform .16s var(--ease-out);
  }
  .video-item .v-up:active { transform:scale(.97); }
  .video-item .v-up[disabled] { opacity:.5; cursor:default; }
  .video-item .sup {
    justify-self:end; border:none; background:none; cursor:pointer; font-family:inherit;
    font-size:0.71875rem; font-weight:700; color:var(--ko); min-height:44px; padding:0 12px;
  }

  /* ── Photos & catégories ── */
  .cats { display:flex; flex-wrap:wrap; gap:8px; }
  .cats button {
    border:none; cursor:pointer; font-family:inherit;
    padding:9px 14px; border-radius:999px; min-height:44px;
    background:var(--pressed); color:var(--ink); font-size:0.75rem; font-weight:600;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
    transition: transform .16s var(--ease-out);
  }
  .cats button:active { transform:scale(.97); }
  .cats button[aria-pressed="true"] { background:var(--btn-bg); color:var(--btn-text); box-shadow:none; }
  .cats .n { opacity:.65; font-weight:500; margin-left:5px; }
  .newcat { display:flex; gap:8px; margin-top:10px; }
  .newcat input {
    flex:1; min-width:0; min-height:44px; padding:0 16px; border:none; border-radius:999px;
    background:var(--pressed); color:var(--ink); font-size:max(1rem, 16px); font-family:inherit; outline:none;
    box-shadow: inset 2px 2px 5px var(--shadow-d), inset -2px -2px 5px var(--shadow-l);
  }
  .newcat button {
    flex:0 0 auto; border:none; cursor:pointer; font-family:inherit; min-height:44px;
    padding:0 16px; border-radius:999px; background:var(--btn-bg); color:var(--btn-text);
    font-size:0.78125rem; font-weight:700; transition: transform .16s var(--ease-out);
  }
  .newcat button:active { transform:scale(.97); }
  .depot {
    width:100%; margin-top:12px; min-height:48px; border:none; border-radius:999px;
    cursor:pointer; font-family:inherit; font-size:0.84375rem; font-weight:700;
    background:var(--btn-bg); color:var(--btn-text);
    transition: transform .16s var(--ease-out);
  }
  .depot:active { transform:scale(.97); }
  .depot[disabled] { opacity:.5; cursor:default; }
  .jauge { height:4px; border-radius:4px; background:var(--pressed); overflow:hidden; margin-top:10px; display:none; }
  .jauge.on { display:block; }
  .jauge i { display:block; height:100%; width:0; background:#b08968; transition: width .3s var(--ease-out); }

  .barre {
    position:sticky; bottom:0; margin:26px -20px -40px;
    /* La barre home d'iPhone recouvrait « Enregistrer » sans cet env(). */
    padding:14px 20px calc(20px + env(safe-area-inset-bottom));
    background:var(--surface); box-shadow:0 -8px 22px var(--shadow-d);
    display:flex; gap:10px; align-items:center;
  }
  .btn {
    flex:1; min-height:48px; border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:0.875rem; font-weight:700;
    background:var(--btn-bg); color:var(--btn-text);
    transition: transform .16s var(--ease-out);
  }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.5; cursor:default; }
  .btn.ghost { flex:0 0 auto; padding:0 18px; background:transparent; color:var(--ink);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 20%, transparent); }
  .etat { font-size:0.75rem; color:var(--muted); margin-top:10px; min-height:18px; }
  .etat.ok { color:var(--ok); }
  .etat.ko { color:var(--ko); }
  :focus-visible { outline:2px solid currentColor; outline-offset:3px; border-radius:8px; }

  /* ── Survol : DESKTOP uniquement ──────────────────────────────
     `hover:hover and pointer:fine` est indispensable : sur tactile,
     un simple :hover reste « collé » après le tap et le bouton
     paraît sélectionné à tort. Ici le survol ne révèle jamais une
     fonction — il ne fait que confirmer ce qui est déjà visible. */
  @media (hover: hover) and (pointer: fine) {
    .btn, .depot, .newcat button, .video-item .v-up {
      transition: transform .16s var(--ease-out), filter .16s var(--ease-out);
    }
    .rail button:hover:not([aria-selected="true"]),
    .cats button:hover:not([aria-pressed="true"]),
    .choix button:hover:not([aria-pressed="true"]),
    .palettes button:hover:not([aria-pressed="true"]) { color:var(--ink); }
    .couvs button:hover { transform:translateY(-2px); }
    .btn:not([disabled]):hover,
    .depot:not([disabled]):hover,
    .newcat button:hover,
    .video-item .v-up:not([disabled]):hover { transform:translateY(-1px); filter:brightness(1.12); }
    .btn.ghost:hover { filter:none; background:var(--pressed); }
    .video-item .sup:hover { text-decoration:underline; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition-duration:.01ms !important; } }
</style>
</head>
<body>
  <div class="studio">
    <aside class="panneau">
      <div class="kicker">Concepteur</div>
      <h1 class="serif" id="titre">Votre galerie</h1>
      <div class="sous" id="sous">Chargement…</div>

      <div class="bloc">
        <div class="titre">Titre de la galerie</div>
        <input id="titre-champ" class="champ" maxlength="120" placeholder="Galerie — Emma &amp; Jules" />
      </div>

      <div class="bloc">
        <div class="titre">Contenu</div>
        <div class="choix" id="kinds"></div>
      </div>

      <div class="bloc" id="bloc-type">
        <div class="titre">Type d'événement</div>
        <div class="choix" id="types"></div>
      </div>

      <!-- Séparation photos / vidéo : n'apparaît que sur une galerie qui
           contient les deux — ailleurs il n'y aurait rien à séparer. -->
      <div class="bloc" id="bloc-volet" hidden>
        <!-- aria-controls dit CE QUE l'onglet montre. Un onglet en pilote
             ici plusieurs (la liste d'ID est valide en ARIA) : les réglages
             photo sont répartis en plusieurs blocs, séparés par la palette
             qui, elle, est commune aux deux volets. -->
        <div class="rail" role="tablist" aria-label="Partie à régler">
          <button type="button" role="tab" data-volet="photos" aria-selected="true"
                  aria-controls="bloc-photos bloc-mode bloc-couv bloc-upload">Photos</button>
          <button type="button" role="tab" data-volet="video" aria-selected="false"
                  aria-controls="bloc-video" tabindex="-1">Vidéo</button>
        </div>
      </div>

      <div class="bloc">
        <div class="titre">Palette de couleurs</div>
        <div class="palettes" id="palettes"></div>
      </div>

      <div class="bloc" id="bloc-photos" hidden>
        <div class="titre">Disposition de la couverture</div>
        <div class="choix" id="couverture"></div>
        <div class="note">
          Couverture vide → la 1ʳᵉ photo de la galerie est utilisée automatiquement.
        </div>
      </div>

      <div class="bloc" id="bloc-mode" hidden>
        <div class="titre">Organisation des photos</div>
        <div class="choix" id="mode"></div>
      </div>

      <div class="bloc" id="bloc-perso" hidden>
        <div class="titre">Couleurs sur mesure</div>
        <div class="perso">
          <label>Fond<input type="color" id="perso-bg" /></label>
          <label>Accent<input type="color" id="perso-ac" /></label>
        </div>
        <div class="choix" id="perso-mode" style="margin-top:8px"></div>
      </div>

      <div class="bloc" id="bloc-couv" hidden>
        <div class="titre">Photo de couverture</div>
        <div class="couvs" id="couvs"></div>
      </div>

      <div class="bloc" id="bloc-video" hidden>
        <div class="titre">Vidéos</div>
        <div id="videos"></div>
        <button type="button" class="depot" id="addvideo" style="margin-top:10px">Ajouter une vidéo</button>
      </div>

      <div class="bloc" id="bloc-upload" hidden>
        <div class="titre">Photos par catégorie</div>
        <div class="cats" id="cats"></div>
        <div class="newcat">
          <input id="newcat" placeholder="Nouvelle catégorie (Préparatifs…)" maxlength="60" />
          <button type="button" id="addcat">Ajouter</button>
        </div>
        <button type="button" class="depot" id="depot">Déposer des photos ici</button>
        <input type="file" id="fichiers" accept="image/*" multiple hidden />
        <div class="jauge" id="jauge" role="progressbar" aria-label="Envoi des photos"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <!-- aria-live : un lecteur d'écran doit ENTENDRE la progression et
             les erreurs — sans ça, l'envoi est un silence total. -->
        <div class="etat" id="etat-upload" role="status" aria-live="polite"></div>
      </div>

      <div class="etat" id="etat" role="status" aria-live="polite"></div>

      <div class="barre">
        <button class="btn" id="save" type="button">Enregistrer</button>
        <button class="btn ghost" id="fermer" type="button">Fermer</button>
      </div>
    </aside>

    <main class="scene">
      <iframe id="apercu" title="Aperçu de la galerie"></iframe>
    </main>
  </div>

<script type="module">
  import { createClient } from '@supabase/supabase-js';
  import { creerPipelinePhotos, slugifyCategorie, b2SafeName } from './galerie-upload.js';
  const sb = createClient(import.meta.env.VITE_SUPABASE_URL, import.meta.env.VITE_SUPABASE_ANON_KEY);
  const { uploadGalleryPhoto, uploadFichier } = creerPipelinePhotos({ sb, supabaseUrl: import.meta.env.VITE_SUPABASE_URL });
  const el = (id) => document.getElementById(id);
  const qs = new URLSearchParams(location.search);

  /* Les cinq prestations que Gil vend (25/07/2026). `mannequinat` rend
     déjà « Votre shooting » côté galerie ; `prewedding` a été ajouté au
     moteur pour l'occasion. Un gabarit hérité absent de cette liste (un
     immobilier créé avant, par exemple) est réinjecté à la volée par
     `rendre()` : on ne réécrit jamais le choix d'un locataire à son insu. */
  const TYPES = [
    { id:'mariage',      l:'Mariage' },
    { id:'anniversaire', l:'Anniversaire de mariage' },
    { id:'fiancailles',  l:'Fiançailles' },
    { id:'prewedding',   l:'Pré-wedding' },
    { id:'mannequinat',  l:'Shooting' },
  ];
  const PALETTES = [
    { id:'noir', l:'Noir', bg:'#0a0a0a', ac:'#b08968' },
    { id:'fumee', l:'Fumée', bg:'#1a1714', ac:'#b1916f' },
    { id:'encre', l:'Encre', bg:'#0d0f14', ac:'#8a93a6' },
    { id:'sapin', l:'Sapin', bg:'#0c0f0d', ac:'#8a9c84' },
    { id:'ardoise', l:'Ardoise', bg:'#13161c', ac:'#7fa0bd' },
    { id:'bordeaux', l:'Bordeaux', bg:'#45100f', ac:'#d2b48c' },
    { id:'acajou', l:'Acajou', bg:'#2a1812', ac:'#c98a5e' },
    { id:'foret', l:'Forêt', bg:'#0e2118', ac:'#c2a878' },
    { id:'creme', l:'Crème', bg:'#f3eee7', ac:'#8b6a48' },
    { id:'lin', l:'Lin', bg:'#f1ece3', ac:'#8a7458' },
    { id:'sauge', l:'Sauge', bg:'#e8ebe4', ac:'#6e7d63' },
    { id:'brume', l:'Brume', bg:'#e9ebee', ac:'#6b7785' },
  ];
  /* Les CINQ dispositions que sait rendre galerie.html (MODES, l. 669) —
     mêmes libellés que la fenêtre de création de la console. Une première
     version n'en montrait que deux : un locataire qui avait choisi
     « Split » ou « Éditorial » à la création ne retrouvait plus son
     réglage ici (relevé par Gil sur capture). */
  const COUVERTURES = [
    { id:'fill',      l:'Plein écran', d:'Photo recadrée + zoom lent' },
    { id:'fit',       l:'Cadrée',      d:'Ratio naturel sur fond palette' },
    { id:'split',     l:'Split',       d:'Photo encadrée à gauche, titre à droite' },
    { id:'editorial', l:'Éditorial',   d:'Grande typo à gauche, photo à droite' },
    { id:'portrait',  l:'Portrait',    d:'Photo arquée centrée, titre dessous' },
  ];
  const MODES = [
    { id:'categorized', l:'Catégories',     d:'Sections par thème' },
    { id:'flat',        l:'Galerie unique', d:'Tout mélangé' },
  ];
  const KINDS = [
    { id:'photos', l:'Photos' }, { id:'video', l:'Film' }, { id:'mixte', l:'Photos + film' },
  ];
  const PERSO_MODES = [
    { id:'dark', l:'Fond sombre' }, { id:'light', l:'Fond clair' },
  ];

  let base = null;      // charge renvoyée par la RPC (forme exacte de la vraie page)
  let draft = null;     // la configuration en cours d'édition
  let pretApercu = false;
  /* Édition authentifiée (enregistrer, déposer) : la RPC publique ne
     livre — à raison — ni client.id ni client.code. On les lit par une
     requête AUTHENTIFIÉE : la RLS ne les donne qu'à un membre de
     l'agence. Sans session (lien ouvert hors console), l'aperçu et les
     réglages marchent, mais le dépôt reste fermé. */
  let edition = null;   // { client:{id,code}, gallery:{id} } si connecté
  let catChoisie = null;
  let catsEnAttente = [];  // catégories créées ici, encore vides
  let volet = 'photos';    // partie réglée sur une galerie « photos + film »

  /* Garde anti-perte (HIG P0 : jamais de perte de données sans
     avertissement). Un INSTANTANÉ de ce qui est enregistré, comparé au
     brouillon à la fermeture — pas un drapeau : basculer un volet ou
     re-rendre sans rien changer ne crie pas au loup. */
  let instantaneSauve = '';
  const instantane = () => draft ? JSON.stringify({
    t: draft.gallery.title, k: draft.gallery.kind,
    g: draft.gallery.template, c: draft.gallery.config,
  }) : '';
  const nonEnregistre = () => draft && instantane() !== instantaneSauve;

  const etat = (msg, cls) => { const e = el('etat'); e.textContent = msg || ''; e.className = 'etat' + (cls ? ' ' + cls : ''); };

  /* Avance une jauge. La largeur est pour l'œil, aria-valuenow pour la
     voix de synthèse : sans lui, une barre qui progresse ne dit
     strictement rien à qui ne la voit pas. */
  const avance = (jauge, ratio) => {
    const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
    jauge.firstElementChild.style.width = `${pct}%`;
    jauge.setAttribute('aria-valuenow', String(pct));
  };

  /* L'aperçu ne se peint que lorsque la page enfant a signalé qu'elle
     écoutait — sinon le premier envoi tomberait dans le vide. */
  function pousser() {
    if (!pretApercu || !draft) return;
    // `voir` voyage AVEC la galerie : l'aperçu se positionne à la fin de
    // sa peinture, quand les sections existent. Un message de défilement
    // séparé arrivait pendant la reconstruction — course perdue.
    const charge = { ...draft, voir: volet };
    el('apercu').contentWindow.postMessage(
      { type:'laloge-preview', payload: charge }, location.origin);
  }

  function boutons(hote, liste, actif, onPick) {
    hote.innerHTML = '';
    liste.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(o.id === actif));
      b.innerHTML = o.d ? `${o.l}<span class="opt-desc">${o.d}</span>` : o.l;
      b.addEventListener('click', () => onPick(o.id));
      hote.appendChild(b);
    });
  }

  function palettes(actif) {
    const hote = el('palettes');
    hote.innerHTML = '';
    // « Sur mesure » en plus des 12 préréglages — l'éditeur qu'on remplace
    // le proposait, on ne perd rien au passage.
    [...PALETTES, { id:'custom', l:'Sur mesure', bg:'#1a1714', ac:'#b08968' }].forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(p.id === actif));
      b.setAttribute('aria-label', p.l);
      b.innerHTML = `<span class="pastille" style="background:${p.bg}"><i style="background:${p.ac}"></i></span><span class="nom">${p.l}</span>`;
      b.addEventListener('click', () => { draft.gallery.config.palette = p.id; rendre(); });
      hote.appendChild(b);
    });
  }

  /* ── Vidéos ───────────────────────────────────────────────
     Modèle `config.videos[]` — le SEUL que lit la galerie
     (normalizeVideos le prend en priorité). Une première version de cet
     écran proposait un choix « film / teaser » : il écrivait des clés
     héritées que la galerie ignore dès qu'une liste existe. Corrigé. */
  /* Le film s'UPLOADE — on ne colle JAMAIS un lien chez un locataire
     (règle de Gil). Le fichier part du navigateur vers B2 sous le
     préfixe du client (périmètre vérifié par b2-sign), en morceaux
     reprenables : un film de mariage pèse plusieurs Go. Il sert ensuite
     de source au worker d'encodage, qui en tire le HLS adaptatif. */
  function rendreVideos() {
    const hote = el('videos');
    const list = draft.gallery.config.videos || [];
    hote.innerHTML = '';

    if (!list.length) {
      // État vide EXPLICITE : l'aperçu est fidèle — sans film, la galerie
      // n'affiche rien — mais il ne l'explique pas. Le dire ici évite de
      // croire que l'aperçu est cassé (retour de Gil).
      const vide = document.createElement('div');
      vide.className = 'vide-film';
      vide.innerHTML = `<strong>Aucun film dans cette galerie.</strong>
        L'aperçu reste donc vide — c'est exactement ce que verrait votre client.
        Ajoutez une vidéo, puis déposez le fichier.`;
      hote.appendChild(vide);
    }

    list.forEach((v, i) => {
      const enLigne = (v.urls && (v.urls['1080p'] || v.urls['4K'])) || '';
      const d = document.createElement('div');
      d.className = 'video-item';
      d.innerHTML = `
        <input class="champ petit" data-k="title" placeholder="Titre (Le Film…)" value="${(v.title || '').replace(/"/g, '&quot;')}" />
        <div class="v-etat">${enLigne
          ? `<span class="v-ok">✓ Film en ligne</span>${v.hls ? '' : ' <span class="v-attente">· encodage en attente</span>'}`
          : '<span class="v-vide">Aucun fichier</span>'}</div>
        <button type="button" class="v-up">${enLigne ? 'Remplacer le film' : 'Déposer le film'}</button>
        <div class="jauge" role="progressbar" aria-label="Envoi du film"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <button type="button" class="sup">Retirer</button>`;

      d.querySelector('input').addEventListener('input', (e) => {
        v.title = e.target.value;
        pousser();                 // l'aperçu suit la frappe, sans re-rendre le panneau
      });

      const bUp = d.querySelector('.v-up');
      const jauge = d.querySelector('.jauge');
      bUp.addEventListener('click', () => {
        if (!edition) { etatUp('Connectez-vous à votre console pour déposer un film.', 'ko'); return; }
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'video/*';
        inp.addEventListener('change', async () => {
          const file = inp.files && inp.files[0];
          if (!file) return;
          const codeSlug = slugifyCategorie(edition.client.code || '');
          if (!codeSlug) { etatUp("Ce client n'a pas encore de code d'accès.", 'ko'); return; }
          bUp.disabled = true; jauge.classList.add('on');
          etatUp(`Envoi de ${file.name}…`);
          try {
            const key = `weddings/${codeSlug}/galerie/videos/${crypto.randomUUID()}/${b2SafeName(file.name)}`;
            const url = await uploadFichier(file, key, (p) => avance(jauge, p));
            v.urls = { ...(v.urls || {}), '1080p': url };
            v.downloadUrl = url;
            // Chez un locataire, le client ne voit le film qu'une fois
            // encodé : sans ce drapeau il verrait une seule qualité brute.
            v.hls = '';
            v.awaitingEncode = true;
            etatUp('Film en ligne — il sera préparé en qualité adaptative.', 'ok');
            rendre();
          } catch (e2) {
            etatUp(`✗ ${e2.message || "L'envoi a échoué — rien n'a été mis en ligne."}`, 'ko');
            bUp.disabled = false; jauge.classList.remove('on');
          }
        });
        inp.click();
      });

      d.querySelector('.sup').addEventListener('click', () => {
        draft.gallery.config.videos = list.filter((_, j) => j !== i);
        rendre();
      });
      hote.appendChild(d);
    });
  }

  el('addvideo').addEventListener('click', () => {
    const cfg = draft.gallery.config;
    cfg.videos = [...(cfg.videos || []), { key: `v${(cfg.videos || []).length + 1}`, title: '', urls: {}, downloadUrl: '' }];
    rendre();
  });

  /* ── Couverture ───────────────────────────────────────────
     Les vignettes viennent d'une requête AUTHENTIFIÉE (la RPC publique
     ne livre pas url_grid par photo hors catégories) — sans session, le
     bloc reste simplement masqué. */
  let photosCouv = [];
  async function chargerCouvertures() {
    if (!edition) return;
    const { data } = await sb.from('gallery_photos')
      .select('id, url_grid').eq('gallery_id', edition.gallery.id)
      .order('position').limit(24);
    photosCouv = data || [];
  }
  function rendreCouvertures() {
    const bloc = el('bloc-couv');
    bloc.hidden = !photosCouv.length;
    if (!photosCouv.length) return;
    const cfg = draft.gallery.config;
    const hote = el('couvs');
    hote.innerHTML = '';
    photosCouv.forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button';
      // La galerie retrouve sa couverture par l'IDENTIFIANT de la photo
      // (flatPhotos.find(p => p.id === cfg.cover)). Une première version
      // enregistrait ici l'URL de la vignette : le choix ne prenait
      // jamais, quelle que soit la photo cliquée.
      b.setAttribute('aria-pressed', String(String(cfg.cover) === String(p.id)));
      b.setAttribute('aria-label', 'Choisir comme couverture');
      b.innerHTML = `<img src="${p.url_grid}" alt="" loading="lazy" />`;
      b.addEventListener('click', () => {
        cfg.cover = (String(cfg.cover) === String(p.id)) ? '' : p.id;
        rendre();
      });
      hote.appendChild(b);
    });
  }

  function rendre() {
    const g = draft.gallery, cfg = g.config;
    const aPhotos = g.kind === 'photos' || g.kind === 'mixte';
    const aVideo  = g.kind === 'video'  || g.kind === 'mixte';
    const deux    = aPhotos && aVideo;

    // Volet actif : forcé sur la seule partie disponible hors galerie mixte.
    if (!deux) volet = aVideo ? 'video' : 'photos';
    el('bloc-volet').hidden = !deux;
    el('bloc-volet').querySelectorAll('button[data-volet]').forEach((b) => {
      const actif = b.getAttribute('data-volet') === volet;
      b.setAttribute('aria-selected', String(actif));
      // Tabindex glissant : dans une barre d'onglets, Tab entre puis SORT
      // du groupe — ce sont les flèches qui circulent dedans. Sans ça, un
      // clavier devait traverser chaque onglet pour atteindre la suite.
      b.tabIndex = actif ? 0 : -1;
    });
    const voirPhotos = aPhotos && (!deux || volet === 'photos');
    const voirVideo  = aVideo  && (!deux || volet === 'video');

    boutons(el('kinds'), KINDS, g.kind || 'photos', (v) => { draft.gallery.kind = v; rendre(); });
    // Gabarit hérité (immobilier, corporate…) : on le réinjecte dans la
    // liste plutôt que de l'écraser en silence au premier clic.
    const types = TYPES.some((t) => t.id === g.template)
      ? TYPES
      : [...TYPES, { id: g.template, l: `${templateNom(g.template)} (actuel)` }];
    boutons(el('types'), types, g.template, (v) => { draft.gallery.template = v; rendre(); });
    palettes(cfg.palette || 'noir');

    el('bloc-photos').hidden = !voirPhotos;
    el('bloc-mode').hidden   = !voirPhotos;
    el('bloc-video').hidden  = !voirVideo;

    if (aPhotos) {
      boutons(el('couverture'), COUVERTURES, cfg.coverMode || 'fill', (v) => { cfg.coverMode = v; rendre(); });
      boutons(el('mode'), MODES, cfg.galleryMode || 'categorized', (v) => { cfg.galleryMode = v; rendre(); });
    }
    if (voirVideo) rendreVideos();

    // Couleurs sur mesure : seulement quand la palette l'est.
    const perso = cfg.palette === 'custom';
    el('bloc-perso').hidden = !perso;
    if (perso) {
      el('perso-bg').value = cfg.customBg || '#1a1714';
      el('perso-ac').value = cfg.customAccent || '#b08968';
      boutons(el('perso-mode'), PERSO_MODES, cfg.customMode || 'dark', (v) => { cfg.customMode = v; rendre(); });
    }

    el('bloc-upload').hidden = !voirPhotos;
    if (voirPhotos) { rendreCats(); rendreCouvertures(); }
    else el('bloc-couv').hidden = true;
    pousser();
  }

  // Nom lisible d'un gabarit hérité, pour ne pas afficher sa valeur brute.
  const NOMS = { evenement:'Événement', immobilier:'Immobilier', corporate:'Corporate', mannequinat:'Shooting' };
  function templateNom(v) { return NOMS[v] || (v ? v.charAt(0).toUpperCase() + v.slice(1) : 'Autre'); }

  el('bloc-volet').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-volet]');
    if (!b) return;
    volet = b.getAttribute('data-volet');
    rendre();          // `pousser()` embarque `voir` : l'aperçu se place seul
  });

  /* Flèches / Origine / Fin — le contrat clavier attendu d'une barre
     d'onglets. Le volet change en suivant le focus : les deux panneaux
     sont déjà là, il n'y a rien à charger, donc rien qui justifie
     d'exiger un Entrée de plus. */
  el('bloc-volet').addEventListener('keydown', (e) => {
    const TOUCHES = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if (!TOUCHES.includes(e.key)) return;
    const onglets = [...el('bloc-volet').querySelectorAll('button[data-volet]')];
    const i = onglets.indexOf(e.target.closest('button[data-volet]'));
    if (i < 0) return;
    e.preventDefault();
    const j = e.key === 'Home'  ? 0
            : e.key === 'End'   ? onglets.length - 1
            : e.key === 'ArrowLeft' ? (i - 1 + onglets.length) % onglets.length
            : (i + 1) % onglets.length;
    volet = onglets[j].getAttribute('data-volet');
    rendre();
    onglets[j].focus();   // rendre() a remis les tabindex : le focus suit
  });

  ['perso-bg', 'perso-ac'].forEach((id) => {
    el(id).addEventListener('input', () => {
      const cfg = draft.gallery.config;
      cfg.customBg     = el('perso-bg').value;
      cfg.customAccent = el('perso-ac').value;
      pousser();                 // suit le curseur sans re-rendre le panneau
    });
  });

  el('titre-champ').addEventListener('input', () => {
    draft.gallery.title = el('titre-champ').value;
    pousser();
  });

  /* ── Photos par catégorie ─────────────────────────────────── */
  const etatUp = (msg, cls) => { const e = el('etat-upload'); e.textContent = msg || ''; e.className = 'etat' + (cls ? ' ' + cls : ''); };

  function listeCats() {
    const noms = (draft.photos || []).map((c) => ({ nom: c.category || 'Galerie', n: (c.photos || []).length }));
    catsEnAttente.forEach((nom) => {
      if (!noms.some((c) => c.nom === nom)) noms.push({ nom, n: 0 });
    });
    if (!noms.length) noms.push({ nom: 'Galerie', n: 0 });
    return noms;
  }

  function rendreCats() {
    const cats = listeCats();
    if (!catChoisie || !cats.some((c) => c.nom === catChoisie)) catChoisie = cats[0].nom;
    const hote = el('cats');
    hote.innerHTML = '';
    cats.forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(c.nom === catChoisie));
      b.innerHTML = `${c.nom}<span class="n">${c.n}</span>`;
      b.addEventListener('click', () => { catChoisie = c.nom; rendreCats(); });
      hote.appendChild(b);
    });
    if (!edition) {
      el('depot').disabled = true;
      etatUp('Ouvrez ce concepteur depuis votre console (connecté) pour déposer des photos.');
    }
  }

  // Entrée VALIDE (règle formulaire du guide) : taper un nom puis Entrée
  // ajoute la catégorie — sans devoir viser le bouton.
  el('newcat').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el('addcat').click(); }
  });

  el('addcat').addEventListener('click', () => {
    const nom = el('newcat').value.trim();
    if (!nom) return;
    if (listeCats().some((c) => c.nom === nom)) { etatUp('Cette catégorie existe déjà.', 'ko'); return; }
    catsEnAttente.push(nom);
    catChoisie = nom;
    el('newcat').value = '';
    etatUp('');
    rendreCats();
  });

  el('depot').addEventListener('click', () => el('fichiers').click());
  el('fichiers').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
    e.target.value = '';
    if (!files.length || !edition) return;

    // Position d'insertion : à la suite de la catégorie (même règle que la console).
    let position = 0;
    try {
      const { data: dern } = await sb.from('gallery_photos')
        .select('position').eq('gallery_id', edition.gallery.id).eq('category', catChoisie)
        .order('position', { ascending: false }).limit(1);
      if (dern && dern.length) position = (dern[0].position ?? 0) + 1;
    } catch (_) {}

    el('depot').disabled = true;
    const jauge = el('jauge');   // le CONTENEUR : c'est lui qui porte role=progressbar
    jauge.classList.add('on');
    try {
      for (let i = 0; i < files.length; i++) {
        etatUp(`Photo ${i + 1}/${files.length}…`);
        await uploadGalleryPhoto({
          client: edition.client, gallery: edition.gallery,
          category: catChoisie, position: position + i, file: files[i],
          onProgress: (p) => avance(jauge, (i + p) / files.length),
        });
      }
      etatUp(`${files.length} photo${files.length > 1 ? 's' : ''} en ligne.`, 'ok');
      catsEnAttente = catsEnAttente.filter((n) => n !== catChoisie);
      await rafraichirPhotos();
    } catch (err) {
      // Les messages de b2-sign (quota plein, fichier trop gros…) arrivent
      // tels quels : ils sont déjà écrits pour être lus par un humain.
      etatUp(`✗ ${err.message}`, 'ko');
    }
    jauge.classList.remove('on');
    avance(jauge, 0);
    el('depot').disabled = false;
  });

  /* Après un dépôt : on redemande la charge à la MÊME RPC que la vraie
     page, en gardant les réglages en cours d'édition — l'aperçu montre
     les nouvelles photos sans perdre le travail non enregistré. */
  async function rafraichirPhotos() {
    const code = (qs.get('c') || '').trim().toLowerCase();
    const { data } = await sb.rpc('get_gallery_by_code', { p_code: code });
    if (data && data.gallery) {
      draft.photos = data.photos || [];
      rendre();
    }
  }

  /* Un seul enregistrement à la fois. Sans ce verrou, un double-clic
     lançait DEUX enregistrements concurrents — et surtout deux tours de
     mise en file d'encodage, donc un film transcodé en double. */
  let enregistrementEnCours = false;

  el('save').addEventListener('click', async () => {
    if (!edition) { etat('Connectez-vous à votre console pour enregistrer.', 'ko'); return; }
    if (enregistrementEnCours) return;

    const bSave = el('save');
    enregistrementEnCours = true;
    bSave.disabled = true;
    bSave.textContent = 'Enregistrement…';
    etat('Enregistrement…');
    try {
      // Le titre et le contenu font partie de la galerie, pas de sa config :
      // cet écran remplace l'ancienne fenêtre d'édition, il enregistre donc tout.
      const cfg = draft.gallery.config;
      // Une vidéo sans titre ni fichier ne sert à rien : on ne l'enregistre pas.
      if (Array.isArray(cfg.videos)) {
        cfg.videos = cfg.videos.filter((v) => (v.title || '').trim() || (v.urls && (v.urls['1080p'] || v.urls['4K'])));
        cfg.videos.forEach((v, i) => { v.key = (v.key || `v${i + 1}`).replace(/[^a-zA-Z0-9_-]/g, '') || `v${i + 1}`; });
        if (!cfg.defaultVideo || !cfg.videos.some((v) => v.key === cfg.defaultVideo)) {
          cfg.defaultVideo = cfg.videos[0]?.key || '';
        }
      }

      const { error } = await sb.from('galleries')
        .update({
          title: (draft.gallery.title || '').trim() || 'Galerie',
          kind: draft.gallery.kind,
          template: draft.gallery.template,
          config: cfg,
        })
        .eq('id', draft.gallery.id);
      if (error) { etat(`Échec : ${error.message}`, 'ko'); return; }

      /* File d'attente d'encodage (brique 15) — sans ce ticket, le film
         resterait en une seule qualité ET invisible pour le client, qui
         attend le drapeau `awaitingEncode`. Le worker le transcode en
         4K→480p adaptatif puis lève le drapeau lui-même.
         Jamais bloquant : l'enregistrement est déjà fait. Le code 23505
         signale un ticket déjà en attente — c'est un succès, pas une erreur. */
      let enfiles = 0;
      for (const v of (cfg.videos || [])) {
        const mp4 = v?.urls?.['1080p'];
        if (!mp4 || v.hls) continue;
        try {
          const { error: e2 } = await sb.from('encode_jobs').insert({
            kind: 'gallery_video', gallery_id: draft.gallery.id,
            video_key: v.key, source_url: mp4,
          });
          if (!e2 || e2.code === '23505') enfiles++;
        } catch (_) { /* la galerie est enregistrée : on n'échoue pas là-dessus */ }
      }
      etat(enfiles
        ? `Galerie enregistrée · ${enfiles} film(s) en préparation.`
        : 'Galerie enregistrée.', 'ok');
      instantaneSauve = instantane();     // plus rien à perdre
    } catch (err) {
      // Une coupure réseau ne doit pas laisser le bouton mort et muet.
      etat(`Échec : ${err.message || "l'enregistrement n'a pas abouti."}`, 'ko');
    } finally {
      enregistrementEnCours = false;
      bSave.disabled = false;
      bSave.textContent = 'Enregistrer';
    }
  });
  el('fermer').addEventListener('click', () => {
    if (nonEnregistre() &&
        !confirm("Des réglages ne sont pas enregistrés.\n\nFermer quand même ? Ils seront perdus.")) return;
    window.close();
  });
  window.addEventListener('beforeunload', (e) => {
    if (nonEnregistre()) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ── Démarrage ─────────────────────────────────────────────
     On repasse par la MÊME RPC que la vraie galerie : la charge a donc
     exactement la forme attendue par le moteur de rendu, sans rien
     redériver à la main (et sans risque de divergence). */
  (async () => {
    const code = (qs.get('c') || '').trim().toLowerCase();
    if (!code) { etat("Aucune galerie indiquée.", 'ko'); return; }

    const { data, error } = await sb.rpc('get_gallery_by_code', { p_code: code });
    if (error || !data || !data.gallery) { etat("Galerie introuvable.", 'ko'); return; }

    base  = data;
    draft = JSON.parse(JSON.stringify(data));
    draft.gallery.config = draft.gallery.config || {};
    instantaneSauve = instantane();     // référence « rien à perdre »

    el('titre').textContent = draft.gallery.title || 'Votre galerie';
    el('titre-champ').value = draft.gallery.title || '';
    el('sous').textContent = (draft.client && draft.client.name) ? draft.client.name : 'Galerie';

    // Édition : gallery.id + client (id, code) par requêtes authentifiées.
    // Sans session ou hors RLS, `edition` reste nul → dépôt fermé,
    // aperçu et réglages intacts.
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: gRow } = await sb.from('galleries')
          .select('id, client_id').eq('id', draft.gallery.id).maybeSingle();
        if (gRow?.client_id) {
          const { data: cRow } = await sb.from('clients')
            .select('id, code').eq('id', gRow.client_id).maybeSingle();
          if (cRow?.code) edition = { client: cRow, gallery: { id: gRow.id } };
        }
      }
    } catch (_) { edition = null; }
    await chargerCouvertures();

    // L'enfant annonce qu'il écoute ; alors seulement on peint.
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      if (e.data && e.data.type === 'laloge-preview-ready') { pretApercu = true; pousser(); }
    });
    // Sans extension : /galerie.html répond 308 vers /galerie — autant
    // charger la bonne adresse du premier coup.
    el('apercu').src = '/galerie?preview=1';

    rendre();
  })();
</script>
</body>
</html>
